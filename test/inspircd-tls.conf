# InspIRCd configuration with TLS support for ZeroClaw testing

serverinfo {
    name = "localhost";
    description = "ZeroClaw Test IRC Server";
    network = "ZeroClaw";
}

admin {
    name = "ZeroClaw Admin";
    email = "admin@localhost";
    nick = "admin";
}

listen {
    addr = "0.0.0.0";
    port = "6667";
    ssl = "none";
}

listen {
    addr = "0.0.0.0";
    port = "6697";
    ssl = "openssl";
}

sslconfig {
    provider = "openssl";
    dhfile = "/etc/inspircd/dhparams.pem";
    certificate = "/etc/inspircd/ssl_cert.pem";
    key = "/etc/inspircd/ssl_key.pem";
}

module {
    name = "m_ssl_gnutls.so";
}

module {
    name = "m_sslinfo.so";
}

module {
    name = "m_sslmodes.so";
}

# Allow all users for testing
class {
    name = "users";
    limit = "1000";
}

type {
    name = "users";
    classes = "users";
}

user {
    host = "irc.user";
    modes = "";
}

channel {
    modes = "";
}

options {
    casemapping = "ascii";
    disablewhois = "no";
}

log {
    method = "file";
    target = "/var/log/inspircd/inspircd.log";
    level = "default";
    type = "*";
}
